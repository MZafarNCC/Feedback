<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>National Catering Company - Language Selection</title>
<style>
:root { --emerald:#09A585; --palm:#0B4745; --white:#F7FFFD; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; padding:28px 16px; font-family:'Segoe UI',Tahoma,Arial,sans-serif;
 display:flex; justify-content:center; align-items:center; color:var(--white);
 background: radial-gradient(ellipse at 83% 7%, rgba(43,218,177,.25),transparent 40%),
 radial-gradient(ellipse at 3% 95%, rgba(9,165,133,.48),transparent 48%),
 linear-gradient(135deg,#0B4745 0%, #073E3D 45%, #09A585 160%); overflow-x:hidden; }
body::before,body::after { content:''; position:fixed; width:440px; height:440px; border:55px solid rgba(38,221,184,.09); border-radius:50%; pointer-events:none; }
body::before { left:-260px; top:-250px; } body::after { right:-260px; bottom:-280px; }
.container { position:relative; z-index:1; width:100%; max-width:540px; padding:42px 36px 28px;
 text-align:center; border-radius:26px; border:1px solid rgba(217,255,248,.22);
 background:linear-gradient(155deg,rgba(13,94,84,.96),rgba(7,55,55,.98));
 box-shadow:0 25px 65px rgba(0,24,22,.4),inset 0 1px rgba(255,255,255,.08); }
.logo-row { display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
.logo-row img { width:116px; height:116px; object-fit:contain; filter:drop-shadow(0 8px 16px rgba(0,0,0,.18)); }
h1 { margin:0; color:#fff; font-size:30px; letter-spacing:1.6px; font-weight:750; line-height:1.2; }
h1 span { display:block; color:#72F3D5; font-size:16px; font-weight:500; letter-spacing:6px; margin-top:5px; }
.brand-line { width:66px; height:3px; border-radius:10px; background:var(--emerald); margin:24px auto 22px; }
.subtitle { color:#D6F2EC; font-size:17px; line-height:1.6; margin:0 0 24px; }
.button { display:flex; align-items:center; justify-content:center; width:100%; min-height:57px; margin:12px 0;
 padding:14px; border-radius:13px; border:1px solid rgba(112,239,209,.35); text-decoration:none;
 background:linear-gradient(105deg,rgba(9,165,133,.90),rgba(9,118,105,.96));
 color:#fff; font-size:19px; font-weight:600; transition:transform .2s,box-shadow .2s,background .2s;
 box-shadow:0 5px 14px rgba(0,28,25,.14); }
.button:hover,.button:focus-visible { transform:translateY(-2px); background:linear-gradient(105deg,#16B997,#0D8075);
 box-shadow:0 9px 24px rgba(0,25,24,.3); outline:2px solid rgba(165,255,231,.65); outline-offset:2px; }
.footer { margin-top:28px; padding-top:19px; border-top:1px solid rgba(255,255,255,.16);
 font-size:13px; color:#C1E2DB; }
@media(max-width:480px) { .container{padding:30px 20px 22px} .logo-row img{width:96px;height:96px} h1{font-size:25px} h1 span{font-size:14px} .button{font-size:18px} }
</style>
</head>
