<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}
body{
  margin:0;
    padding:20px;

    font-family:'Segoe UI',sans-serif;

    background:
    radial-gradient(circle at center,
    #173436 0%,
    #112C2F 35%,
    #0D2528 65%,
    #091E21 100%);

    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;

}
.container{
  background:#1E3A3D;

    width:100%;
    max-width:550px;

    padding:40px;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:0 15px 40px rgba(0,0,0,.30);

    text-align:center;
}
.logo-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
  margin-bottom:20px;
}
.logo-row img{
  height:60px;
  width:auto;
}
.logo-divider{
  width:1px;
  height:40px;
  background:#ddd;
}
h1{
  color:#0A2528;
  margin-bottom:10px;
  font-size:24px;
}
.subtitle{
  color:#666;
  margin-bottom:30px;
  font-size:17px;
}
.button{
  display:block;
  text-decoration:none;
  background:#0A2528;
  color:white;
  padding:16px;
  margin:14px 0;
  border-radius:10px;
  font-size:20px;
  font-weight:600;
  transition:.3s;
  border:2px solid transparent;
}
.button:hover{
  background:#C9A063;
  border-color:#C9A063;
  transform:translateY(-2px);
}
.footer{
  margin-top:30px;
  font-size:13px;
  color:#888;
}
</style>
